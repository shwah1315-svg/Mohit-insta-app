<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Insta Profile Viewer</title>
    <!-- Tailwind CSS for Instagram-like UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #262626; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 px-4 py-3 flex justify-between items-center max-w-md mx-auto w-full">
        <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-purple-600 via-pink-600 to-yellow-500 bg-clip-text text-transparent">MK Insta</h1>
        <button onclick="resetSearch()" id="changeBtn" class="hidden text-xs font-medium text-sky-500 hover:text-sky-600 bg-sky-50 px-3 py-1.5 rounded-lg border border-sky-100">
            <i class="fa-solid fa-rotate-right mr-1"></i> Change ID
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        
        <!-- Search Box (Shown only if no user saved) -->
        <div id="searchContainer" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm text-center">
            <div class="w-16 h-16 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px] rounded-full mx-auto mb-3">
                <div class="w-full h-full bg-white rounded-full p-1 flex items-center justify-center">
                    <i class="fa-solid fa-user text-2xl text-gray-400"></i>
                </div>
            </div>
            <h2 class="text-base font-semibold mb-1">Instagram Profile</h2>
            <p class="text-xs text-gray-500 mb-4">Enter username to save and view instantly.</p>

            <div class="flex flex-col space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">@</span>
                    <input type="text" id="usernameInput" placeholder="username" 
                        class="w-full pl-8 pr-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-500">
                </div>
                <button onclick="saveAndLoadProfile()" 
                    class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2 rounded-lg text-sm transition duration-200 shadow-sm">
                    Save & View Profile
                </button>
            </div>
        </div>

        <!-- Saved Profile Card (Insta Style - Loads automatically) -->
        <div id="profileContainer" class="hidden bg-white border border-gray-200 rounded-xl p-6 shadow-sm text-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px] rounded-full mx-auto mb-4">
                <div class="w-full h-full bg-white rounded-full p-1 flex items-center justify-center">
                    <i class="fa-solid fa-user text-3xl text-gray-500"></i>
                </div>
            </div>
            
            <h2 class="text-lg font-bold mb-1" id="profileUsernameDisplay">@username</h2>
            <p class="text-xs text-gray-500 mb-6">Profile is saved securely in your device.</p>

            <div class="space-y-3">
                <button onclick="openProfileDirectly()" 
                    class="w-full bg-gradient-to-r from-purple-600 via-pink-600 to-yellow-500 text-white font-medium py-2.5 rounded-lg text-sm transition duration-200 shadow-md">
                    <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Open Instagram Profile
                </button>
                <p class="text-[11px] text-gray-400">Clicking this will instantly load the profile without any blocks.</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-xs text-gray-400 border-t border-gray-100 max-w-md mx-auto w-full">
        <p>&copy; 2026 MK Insta Viewer</p>
    </footer>

    <script>
        let currentUsername = '';

        // Check local storage on page load
        window.onload = function() {
            const savedUser = localStorage.getItem('mk_insta_user');
            if (savedUser) {
                currentUsername = savedUser;
                showProfileCard(savedUser);
            }
        };

        function saveAndLoadProfile() {
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            if (username) {
                localStorage.setItem('mk_insta_user', username);
                currentUsername = username;
                showProfileCard(username);
            } else {
                alert('Please enter a username!');
            }
        }

        function showProfileCard(username) {
            document.getElementById('searchContainer').classList.add('hidden');
            document.getElementById('profileContainer').classList.remove('hidden');
            document.getElementById('changeBtn').classList.remove('hidden');
            document.getElementById('profileUsernameDisplay').innerText = '@' + username;
        }

        function openProfileDirectly() {
            if (currentUsername) {
                const targetUrl = `https://imginn.com/${currentUsername}/`;
                window.open(targetUrl, '_blank');
            }
        }

        function resetSearch() {
            localStorage.removeItem('mk_insta_user');
            document.getElementById('profileContainer').classList.add('hidden');
            document.getElementById('changeBtn').classList.add('hidden');
            document.getElementById('searchContainer').classList.remove('hidden');
            document.getElementById('usernameInput').value = '';
        }
    </script>
</body>
</html>
