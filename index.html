<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Insta Profile Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #fafafa; color: #262626; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        header { background: #ffffff; border-bottom: 1px solid #dbdbdb; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        h1 { font-size: 20px; font-weight: 700; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        main { max-width: 400px; width: 100%; margin: auto; padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .card { background: #ffffff; border: 1px solid #dbdbdb; border-radius: 12px; padding: 24px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .avatar-ring { width: 70px; height: 70px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743); border-radius: 50%; padding: 2px; margin: 0 auto 16px auto; display: flex; align-items: center; justify-content: center; }
        .avatar-inner { width: 100%; height: 100%; background: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #8e8e8e; font-size: 24px; }
        .input-box { position: relative; margin-bottom: 12px; }
        .input-box span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #8e8e8e; font-size: 14px; }
        input { width: 100%; padding: 10px 10px 10px 28px; background: #fafafa; border: 1px solid #dbdbdb; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus { border-color: #a8a8a8; }
        .btn { width: 100%; background: #0095f6; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn:hover { background: #1877f2; }
        .btn-gradient { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); margin-top: 12px; }
        .hidden { display: none !important; }
        .change-btn { background: #efefef; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: #262626; }
        footer { text-align: center; font-size: 12px; color: #8e8e8e; padding: 16px; border-top: 1px solid #efefef; }
    </style>
</head>
<body>

    <header>
        <h1>MK Insta</h1>
        <button onclick="resetSearch()" id="changeBtn" class="change-btn hidden">Change ID</button>
    </header>

    <main>
        <!-- Search Screen -->
        <div id="searchContainer" class="card">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
            <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">Instagram Profile</h2>
            <p style="font-size: 12px; color: #8e8e8e; margin-bottom: 20px;">Enter username to save and view securely.</p>

            <div class="input-box">
                <span>@</span>
                <input type="text" id="usernameInput" placeholder="username">
            </div>
            <button onclick="saveAndLoadProfile()" class="btn">Save & View Profile</button>
        </div>

        <!-- Saved Profile Card -->
        <div id="profileContainer" class="card hidden">
            <div class="avatar-ring" style="width: 80px; height: 80px;">
                <div class="avatar-inner" style="font-size: 32px;">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
            
            <h2 id="profileUsernameDisplay" style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">@username</h2>
            <p style="font-size: 12px; color: #8e8e8e; margin-bottom: 20px;">Profile is saved on your device.</p>

            <button onclick="openProfileDirectly()" class="btn btn-gradient">
                <i class="fa-solid fa-arrow-up-right-from-square" style="margin-right: 6px;"></i> Open Instagram Profile
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MK Insta Viewer</p>
    </footer>

    <script>
        let currentUsername = '';

        window.onload = function() {
            try {
                const savedUser = localStorage.getItem('mk_insta_user');
                if (savedUser) {
                    currentUsername = savedUser;
                    showProfileCard(savedUser);
                }
            } catch (e) {
                console.error(e);
            }
        };

        function saveAndLoadProfile() {
            const inputField = document.getElementById('usernameInput');
            if (!inputField) return;
            const username = inputField.value.trim().toLowerCase();
            if (username) {
                localStorage.setItem('mk_insta_user', username);
                currentUsername = username;
                showProfileCard(username);
            } else {
                alert('Please enter a username!');
            }
        }

        function showProfileCard(username) {
            const searchCont = document.getElementById('searchContainer');
            const profileCont = document.getElementById('profileContainer');
            const changeBtn = document.getElementById('changeBtn');
            const displayElem = document.getElementById('profileUsernameDisplay');

            if (searchCont) searchCont.classList.add('hidden');
            if (profileCont) profileCont.classList.remove('hidden');
            if (changeBtn) changeBtn.classList.remove('hidden');
            if (displayElem) displayElem.innerText = '@' + username;
        }

        function openProfileDirectly() {
            if (currentUsername) {
                const targetUrl = `https://imginn.com/${currentUsername}/`;
                window.open(targetUrl, '_blank');
            }
        }

        function resetSearch() {
            localStorage.removeItem('mk_insta_user');
            const searchCont = document.getElementById('searchContainer');
            const profileCont = document.getElementById('profileContainer');
            const changeBtn = document.getElementById('changeBtn');
            const inputField = document.getElementById('usernameInput');

            if (profileCont) profileCont.classList.add('hidden');
            if (changeBtn) changeBtn.classList.add('hidden');
            if (searchCont) searchCont.classList.remove('hidden');
            if (inputField) inputField.value = '';
        }
    </script>
</body>
</html>
