<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Insta Viewer</title>
    <!-- Tailwind CSS for clean, Instagram-like UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #262626; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-purple-600 via-pink-600 to-yellow-500 bg-clip-text text-transparent">MK Insta</h1>
        <div class="flex items-center space-x-4 text-xl">
            <i class="fa-regular fa-heart cursor-pointer hover:text-gray-600"></i>
            <i class="fa-regular fa-paper-plane cursor-pointer hover:text-gray-600"></i>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        
        <!-- Profile Card Box (Insta Style) -->
        <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm text-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px] rounded-full mx-auto mb-4">
                <div class="w-full h-full bg-white rounded-full p-1 flex items-center justify-center">
                    <i class="fa-solid fa-user text-3xl text-gray-400"></i>
                </div>
            </div>
            
            <h2 class="text-lg font-semibold mb-1" id="displayUsername">Instagram Profile</h2>
            <p class="text-xs text-gray-500 mb-6">Enter username below to view safely without blocks.</p>

            <!-- Search Form -->
            <div class="flex flex-col space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">@</span>
                    <input type="text" id="usernameInput" placeholder="Enter username..." 
                        class="w-full pl-8 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-500">
                </div>
                <button onclick="openProfile()" 
                    class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2.5 rounded-lg text-sm transition duration-200 shadow-sm">
                    View Profile
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-gray-400 border-t border-gray-100">
        <p>&copy; 2026 MK Insta Viewer. Clean & Fast UI.</p>
    </footer>

    <script>
        function openProfile() {
            const username = document.getElementById('usernameInput').value.trim();
            if(username) {
                // Safely redirect to alternative viewer site to bypass direct blocking
                const targetUrl = `https://imginn.com/${username}/`;
                window.open(targetUrl, '_blank');
            } else {
                alert('Please enter a valid username first!');
            }
        }
    </script>
</body>
</html>
