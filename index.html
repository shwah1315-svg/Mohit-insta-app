<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Insta Profile Viewer</title>
    <!-- Tailwind CSS for Instagram-like UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafafa; color: #262626; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 px-4 py-3 flex justify-between items-center max-w-md mx-auto w-full">
        <h1 id="appTitle" class="text-lg font-bold tracking-tight cursor-pointer" onclick="resetSearch()">MK Insta</h1>
        <div class="flex items-center space-x-4 text-xl">
            <button onclick="toggleSearchBox()" class="text-sm font-medium text-sky-500 hover:text-sky-600 focus:outline-none">
                <i class="fa-solid fa-magnifying-glass"></i> Search
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full mx-auto p-4 flex-grow flex flex-col">
        
        <!-- Search Box (Hidden by default if profile is saved) -->
        <div id="searchContainer" class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm text-center mb-4">
            <div class="w-16 h-16 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px] rounded-full mx-auto mb-3">
                <div class="w-full h-full bg-white rounded-full p-1 flex items-center justify-center">
                    <i class="fa-solid fa-user text-2xl text-gray-400"></i>
                </div>
            </div>
            <h2 class="text-base font-semibold mb-1">Enter Instagram Username</h2>
            <p class="text-xs text-gray-500 mb-4">View profile instantly without restrictions.</p>

            <div class="flex flex-col space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">@</span>
                    <input type="text" id="usernameInput" placeholder="username" 
                        class="w-full pl-8 pr-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-gray-500">
                </div>
                <button onclick="saveAndLoadProfile()" 
                    class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2 rounded-lg text-sm transition duration-200">
                    View Profile
                </button>
            </div>
        </div>

        <!-- Instagram Profile UI Section (Loads automatically if saved) -->
        <div id="profileContainer" class="hidden flex-col space-y-4">
            <!-- Profile Header (Insta Style) -->
            <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div class="w-20 h-20 bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 p-[2px] rounded-full">
                        <div class="w-full h-full bg-gray-100 rounded-full flex items-center justify-center overflow-hidden">
                            <i class="fa-solid fa-user text-3xl text-gray-400" id="profileAvatarIcon"></i>
                        </div>
                    </div>
                    <div class="flex space-x-6 text-center flex-grow justify-around pl-4">
                        <div>
                            <span class="block font-bold text-sm">--</span>
                            <span class="text-xs text-gray-500">Posts</span>
                        </div>
                        <div>
                            <span class="block font-bold text-sm">--</span>
                            <span class="text-xs text-gray-500">Followers</span>
                        </div>
                        <div>
                            <span class="block font-bold text-sm">--</span>
                            <span class="text-xs text-gray-500">Following</span>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <h3 class="font-bold text-sm" id="profileUsernameDisplay">@username</h3>
                    <p class="text-xs text-gray-600 mt-1">Instagram Profile Viewer</p>
                </div>

                <div class="flex space-x-2">
                    <a id="externalLinkBtn" href="#" target="_blank" class="flex-grow bg-gray-100 hover:bg-gray-200 text-gray-800 text-center font-medium py-1.5 rounded-lg text-xs transition duration-200">
                        Open Full Profile <i class="fa-solid fa-external-link-alt ml-1"></i>
                    </a>
                    <button onclick="resetSearch()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded-lg text-xs">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <!-- Embedded Web View Container -->
            <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm flex-grow" style="height: 450px;">
                <iframe id="profileFrame" src="" class="w-full h-full border-0"></iframe>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-xs text-gray-400 border-t border-gray-100 max-w-md mx-auto w-full">
        <p>&copy; 2026 MK Insta Viewer</p>
    </footer>

    <script>
        // Check local storage on page load
        window.onload = function() {
            const savedUser = localStorage.getItem('mk_insta_user');
            if (savedUser) {
                loadProfileUI(savedUser);
            }
        };

        function saveAndLoadProfile() {
            const username = document.getElementById('usernameInput').value.trim().toLowerCase();
            if (username) {
                localStorage.setItem('mk_insta_user', username);
                loadProfileUI(username);
            } else {
                alert('Please enter a username!');
            }
        }

        function loadProfileUI(username) {
            document.getElementById('searchContainer').classList.add('hidden');
            document.getElementById('profileContainer').classList.remove('flex');
            document.getElementById('profileContainer').classList.add('flex');
            
            document.getElementById('profileUsernameDisplay').innerText = '@' + username;
            
            // Set targets
            const targetUrl = `https://imginn.com/${username}/`;
            document.getElementById('profileFrame').src = targetUrl;
            document.getElementById('externalLinkBtn').href = targetUrl;
        }

        function toggleSearchBox() {
            const searchBox = document.getElementById('searchContainer');
            if (searchBox.classList.contains('hidden')) {
                searchBox.classList.remove('hidden');
            } else {
                searchBox.classList.add('hidden');
            }
        }

        function resetSearch() {
            localStorage.removeItem('mk_insta_user');
            document.getElementById('profileContainer').classList.remove('flex');
            document.getElementById('profileContainer').classList.add('hidden');
            document.getElementById('searchContainer').classList.remove('hidden');
            document.getElementById('usernameInput').value = '';
        }
    </script>
</body>
</html>
